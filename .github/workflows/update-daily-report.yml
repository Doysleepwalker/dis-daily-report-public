name: Update DIS Daily Report

on:
  workflow_dispatch:
  schedule:
    # 09:15 Asia/Bangkok = 02:15 UTC
    # Tue-Sat Bangkok; intentionally after the 08:00 GCP production scheduler
    - cron: "15 2 * * 2-6"

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch production daily report
        run: |
          mkdir -p public

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "https://disrpt-1049943602814.web.app/daily-report" \
            -o public/daily_run_latest.json

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("public/daily_run_latest.json")
          data = json.loads(p.read_text())

          required = [
              "status",
              "target_session",
              "decision",
              "m1",
              "m2",
              "m3",
              "macro",
              "checks",
              "contract",
              "version",
          ]

          missing = [k for k in required if k not in data]

          if missing:
              raise SystemExit(
                  "Missing required keys: " + ", ".join(missing)
              )

          if data.get("status") != "PASS":
              raise SystemExit(
                  f"Production aggregate status is not PASS: "
                  f"{data.get('status')}"
              )

          if data.get("contract") != "DIS_DAILY_AGGREGATE_CONTRACT_V1":
              raise SystemExit(
                  f"Unexpected contract: {data.get('contract')}"
              )

          if data.get("version") != "PRODUCTION_DAILY_AGGREGATE_V1":
              raise SystemExit(
                  f"Unexpected version: {data.get('version')}"
              )

          failed_checks = [
              k for k, v in data.get("checks", {}).items()
              if v is not True
          ]

          if failed_checks:
              raise SystemExit(
                  "Aggregate checks failed: " + ", ".join(failed_checks)
              )

          print("JSON_VALIDATION=PASS")
          print("TARGET_SESSION=" + str(data.get("target_session")))
          print("STATUS=" + str(data.get("status")))
          print("CONTRACT=" + str(data.get("contract")))
          print("VERSION=" + str(data.get("version")))
          PY

      - name: Publish only when changed
        run: |
          git add public/daily_run_latest.json

          if git diff --cached --quiet; then
            echo "REPORT_CHANGED=NO"
            echo "Nothing to commit."
          else
            echo "REPORT_CHANGED=YES"

            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update DIS daily report"
            git push
          fi
